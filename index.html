<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachBack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred column, one thing per screen (Learn, Teach, Result). Flat, no shadows, a single blue accent. */
  --bg:#fafafa; --surface:#ffffff; --soft:#f0f1f3; --ink:#111214; --muted:#666a71; --line:#e3e4e8;
  --accent:#2f5bea; --accent-ink:#ffffff; --warn:#b3261e;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0d0e10; --surface:#15171a; --soft:#1d2024; --ink:#ededef; --muted:#9a9da4; --line:#282b30;
    --accent:#86a8ff; --accent-ink:#0a1024; --warn:#ff8f85; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0d0e10; --surface:#15171a; --soft:#1d2024; --ink:#ededef; --muted:#9a9da4; --line:#282b30;
  --accent:#86a8ff; --accent-ink:#0a1024; --warn:#ff8f85; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 56px}
.wrap.wide{max-width:980px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:44px;line-height:1.08}
h2{font-size:30px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ai{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;margin-bottom:34px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:24px;border:0;background:none;cursor:pointer;padding:0}
.top .sp{margin-left:auto}
.langs{display:inline-flex;gap:2px}
.langs button{border:0;background:none;padding:2px 6px;cursor:pointer;color:var(--muted);font-size:13px;border-radius:6px}
.langs button[aria-pressed="true"]{color:var(--ink);background:var(--soft)}
.link{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.dot{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live i{background:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:13px 24px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical}
.view{display:none}.view.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* home */
.topiclist{border-top:1px solid var(--line)}
.topic{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 2px;cursor:pointer}
.topic:hover b{color:var(--accent)}
.topic b{font-weight:500;font-size:18px}
.topic span{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.nextstep{font-size:14px;color:var(--muted);margin-top:4px}
.topic:disabled{opacity:.45;cursor:not-allowed}
details summary{cursor:pointer;color:var(--muted)}
details[open] summary{margin-bottom:10px}
ul.plain{margin:4px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}

/* steps */
.steps{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:18px}
.steps b{font-weight:500}
.steps .cur{color:var(--ink)}
.steps i{width:22px;height:1px;background:var(--line)}
.material p{margin:0 0 12px;font-size:17px;line-height:1.6}
.material p:last-child{margin:0}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* teach */
.stagebar{display:flex;gap:6px;margin-bottom:10px}
.stagebar span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stagebar span.done,.stagebar span.cur{background:var(--accent)}
.stagebar span.done{opacity:.45}
.chat{display:flex;flex-direction:column;height:min(58vh,540px);min-height:340px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.nova{background:var(--soft);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:13px;text-align:center;padding:4px;max-width:94%}
.msg .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msg .pf{display:block;font-size:11px;opacity:.8;margin-top:4px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:150px;border-radius:22px;padding:10px 16px}
.round{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.round.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round.send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round:disabled{opacity:.4}
.demobar{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tip{border-left:2px solid var(--accent);padding:2px 0 2px 12px;font-size:15px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* result + review */
.stagerow{display:grid;grid-template-columns:120px 1fr auto;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.stagerow:last-child{border-bottom:0}
.stagerow .lv{white-space:nowrap;font-weight:500}
.stagerow .err{color:var(--warn);font-size:14px;margin-top:3px}
.stagerow select{width:auto;padding:6px 10px;border-radius:999px}
@media (max-width:620px){.stagerow{grid-template-columns:1fr}}
.keys div{padding:5px 0;display:flex;gap:10px}
.keys .no{color:var(--muted)}
.score{font-family:var(--display);font-size:54px;line-height:1}
.transcript{font-size:14px;max-height:340px;overflow:auto;background:var(--soft);border-radius:12px;padding:14px;white-space:pre-wrap}
.sub{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;cursor:pointer}
.sub[aria-current="true"] b{color:var(--accent)}
.sub span{margin-left:auto;color:var(--muted);font-size:13px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr} h1{font-size:36px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <button class="brand" id="brand">TeachBack</button>
    <span id="aiStatus" class="dot sp" role="status"><i></i><span data-t="ai_conn"></span></span>
    <span class="langs" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button><button data-lang="kk">KZ</button>
    </span>
    <button class="link small" id="roleBtn"></button>
  </header>

  <!-- HOME -->
  <section id="v-home" class="view on">
    <div class="stack" style="gap:26px">
      <div class="stack">
        <h1 data-t="h1"></h1>
        <p class="muted" style="font-size:18px;max-width:620px" data-t="sub"></p>
      </div>
      <div>
        <div class="label" style="margin-bottom:8px" data-t="demos_label"></div>
        <div class="topiclist" id="demoList"></div>
      </div>
      <div>
        <div class="label" style="margin-bottom:8px" data-t="live_label"></div>
        <div class="topiclist" id="topicList"></div>
        <p class="small muted" id="noAI" hidden style="margin-top:10px" data-t="no_ai"></p>
      </div>
      <details class="small">
        <summary data-t="how_sum"></summary>
        <ul class="plain">
          <li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li><li data-t="how4"></li><li data-t="how5"></li>
        </ul>
      </details>
    </div>
  </section>

  <!-- LEARN -->
  <section id="v-learn" class="view">
    <div class="steps"><b class="cur">1 <span data-t="s_learn"></span></b><i></i><b>2 <span data-t="s_teach"></span></b><i></i><b>3 <span data-t="s_result"></span></b></div>
    <div class="stack" style="gap:20px">
      <div><div class="label" id="lCourse"></div><h2 id="lTitle"></h2></div>
      <div class="panel material" id="lMaterial"></div>
      <div class="stack" style="gap:8px">
        <span class="small muted" data-t="rate_pre"></span>
        <div class="scale" id="preScale"></div>
      </div>
      <div class="row">
        <button class="btn primary big" id="startBtn" data-t="start"></button>
        <button class="link small" id="practiceBtn" data-t="practice"></button>
      </div>
    </div>
  </section>

  <!-- TEACH -->
  <section id="v-teach" class="view">
    <div class="steps"><b>1 <span data-t="s_learn"></span></b><i></i><b class="cur">2 <span data-t="s_teach"></span></b><i></i><b>3 <span data-t="s_result"></span></b><span style="margin-left:auto"></span><button class="link small" id="quitBtn" data-t="leave"></button></div>
    <div class="stagebar" id="stageBar"></div>
    <div class="row" style="margin-bottom:12px;align-items:baseline">
      <b id="stageName" style="font-weight:500"></b><span class="muted grow" id="stageGoal"></span>
    </div>
    <div class="panel chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="composer">
        <button type="button" class="round" id="micBtn" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="sr">Mic</span>
        </button>
        <label for="inp" class="sr" data-t="ph"></label>
        <textarea id="inp" rows="1" data-t-ph="ph"></textarea>
        <button class="round send" id="sendBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span class="sr">Send</span></button>
      </form>
      <div class="demobar" id="demoBar" hidden>
        <button class="btn primary" id="demoPlay"></button>
        <button class="btn" id="demoNext"></button>
        <button class="link small" id="demoEnd" data-t="skip_res"></button>
        <span class="small muted" style="margin-left:auto" data-t="demo_tag"></span>
      </div>
    </div>
    <div class="row" style="margin-top:14px;align-items:flex-start">
      <div class="grow"><div class="tip" id="tip" hidden></div></div>
      <button class="link small" id="ttsBtn" hidden aria-pressed="false"></button>
      <button class="btn" id="nextBtn"></button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="v-result" class="view">
    <div class="steps"><b>1 <span data-t="s_learn"></span></b><i></i><b>2 <span data-t="s_teach"></span></b><i></i><b class="cur">3 <span data-t="s_result"></span></b></div>
    <div id="resultBox" class="stack" style="gap:20px"></div>
  </section>

  <!-- EDUCATOR -->
  <section id="v-teacher" class="view">
    <div class="row" style="margin-bottom:18px">
      <h2 class="grow" data-t="t_title"></h2>
      <button class="link small" id="tabReview" data-t="t_review"></button>
      <button class="link small" id="tabTopics" data-t="t_topics"></button>
    </div>
    <div id="reviewPane" class="stack" style="gap:20px"><div id="subList"></div><div id="reviewBox" class="stack" style="gap:20px"></div></div>
    <div id="topicsPane" class="stack" hidden>
      <p class="muted" data-t="set_intro"></p>
      <div><label class="f" for="setSel" data-t="set_topic"></label><select id="setSel"></select></div>
      <div class="two">
        <div><label class="f" for="setTitle" data-t="set_title"></label><input type="text" id="setTitle"></div>
        <div><label class="f" for="setCourse" data-t="set_course"></label><input type="text" id="setCourse"></div>
      </div>
      <div><label class="f" for="setMat" data-t="set_mat"></label><textarea id="setMat" rows="5"></textarea></div>
      <div class="two">
        <div><label class="f" for="setKeys" data-t="set_keys"></label><textarea id="setKeys" rows="6"></textarea></div>
        <div><label class="f" for="setMis" data-t="set_mis"></label><textarea id="setMis" rows="6"></textarea></div>
      </div>
      <div><label class="f" for="setScen" data-t="set_scen"></label><input type="text" id="setScen"></div>
      <div class="row"><button class="btn primary" id="saveTopic" data-t="save"></button><button class="btn" id="newTopic" data-t="new_topic"></button><span class="small muted" id="saveMsg"></span></div>
      <p class="small muted" data-t="set_note"></p>
    </div>
  </section>
</div>

let topics = load("tb3_topics") || JSON.parse(JSON.stringify(DEFAULT_TOPICS));
let subs = load("tb4_subs") || [];
let S = null, role = "student", screen = "home", tTab = "review", reviewId = null, blind = false;
let sample = null, aiKnown = false, dict = null, tts = null, ttsOn = false, busy = false, pasted = 0;
let aiResolve; const aiReady = new Promise(r => aiResolve = r);

/* ---------- navigation ---------- */
function show(){
  applyText();
  $$(".view").forEach(v => v.classList.remove("on"));
  $("#roleBtn").textContent = t(role==="teacher" ? "role_student" : "role_teacher");
  $("#wrap").classList.toggle("wide", role==="teacher");
  setStatus();
  if(role==="teacher"){ renderTeacher(); $("#v-teacher").classList.add("on"); return; }
  if(screen==="home") renderHome();
  if(screen==="learn") renderLearn();
  if(screen==="teach") renderTeachText();
  if(screen==="result") renderResult();
  $("#v-"+screen).classList.add("on");
}
$("#roleBtn").addEventListener("click", () => { role = role==="teacher" ? "student" : "teacher"; show(); window.scrollTo(0,0); });
$("#brand").addEventListener("click", leave);
$$(".langs button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; save("tb_lang", lang); show(); }));
function leave(){ stopPlay(); S = null; busy = false; setBusy(); if(tts) try{ tts.stop(); }catch(e){} role = "student"; screen = "home"; show(); window.scrollTo(0,0); }

/* ---------- home ---------- */
function renderHome(){
  const off = aiKnown && !sample;
  $("#noAI").hidden = !off;
  $("#demoList").innerHTML = DEMOS.map(d => `<button class="topic" data-demo="${d.id}"><b>${esc(d.topic.title)}</b><span>${esc(t(d.tag))}</span></button>`).join("");
  $$("[data-demo]").forEach(el => el.addEventListener("click", () => { const d = DEMOS.find(x => x.id===el.dataset.demo); openTopic(d.topic, d); }));
  $("#topicList").innerHTML = topics.map(tp => `<button class="topic" data-id="${esc(tp.id)}" ${off?"disabled":""}><b>${esc(tp.title)}</b><span>${esc(tp.course||"")}</span></button>`).join("");
  $$("[data-id]").forEach(el => el.addEventListener("click", () => openTopic(topics.find(x => x.id===el.dataset.id), null)));
}
function newSession(topic, demo){
  return {id: demo ? "demo-"+demo.id : "s"+Date.now(), demo: demo ? demo.id : null, topic:JSON.parse(JSON.stringify(topic)), mode:"assessed", scripted:!!demo, stage:0, msgs:[], results:[null,null,null,null,null],
    covered:{}, pre:demo?demo.pre:null, post:demo?demo.post:null, startedAt:Date.now(), finishedAt:null, note:"", oral:false, pending:[],
    mis: topic.mis.length ? topic.mis[Math.floor(Math.random()*topic.mis.length)] : "",
    teacher:{scores:{}, comment:"", approved:false}};
}
function demoOf(s){ return DEMOS.find(d => d.id===s.demo); }
function scaleHTML(sel){ return [1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-pressed="${sel===n}" aria-label="${n}/5">${n}</button>`).join(""); }

/* ---------- learn ---------- */
function openTopic(topic, demo){ S = newSession(topic, demo); screen = "learn"; show(); window.scrollTo(0,0); }
function renderLearn(){
  const tp = S.topic;
  $("#lCourse").textContent = (S.scripted ? t("demo")+" · " : "") + (tp.course||"");
  $("#lTitle").textContent = tp.title;
  $("#lMaterial").innerHTML = (tp.mat && tp.mat.length ? tp.mat : [t("no_mat")]).map(p => `<p>${esc(p)}</p>`).join("");
  $("#preScale").innerHTML = scaleHTML(S.pre);
  $("#practiceBtn").hidden = S.scripted;
}
$("#preScale").addEventListener("click", e => { const b = e.target.closest("button"); if(!b || !S) return; S.pre = +b.dataset.n; $("#preScale").innerHTML = scaleHTML(S.pre); });
$("#startBtn").addEventListener("click", () => startTeach("assessed"));
$("#practiceBtn").addEventListener("click", () => startTeach("practice"));

/* ---------- teach ---------- */
function startTeach(mode){
  S.mode = mode; S.startedAt = Date.now();
  $("#msgs").innerHTML = ""; $("#tip").hidden = true;
  $("#composer").hidden = S.scripted; $("#demoBar").hidden = !S.scripted;
  $("#nextBtn").hidden = S.scripted;
  screen = "teach"; show(); window.scrollTo(0,0);
  if(S.scripted){ exPos = 0; enterStage(0, false); exStep(); }
  else enterStage(0, true);
}
function learnerCount(i){ return S.msgs.filter(m => m.stage===i && m.who==="me").length; }
function renderTeachText(){
  if(!S) return;
  $("#stageBar").innerHTML = STAGES.map((_,i) => `<span class="${i<S.stage?"done":i===S.stage?"cur":""}"></span>`).join("");
  $("#stageName").textContent = `${t("stage_of", S.stage+1)} · ${t("st"+S.stage)}`;
  $("#stageGoal").textContent = t("g"+S.stage);
  const last = S.stage===4, said = learnerCount(S.stage) > 0;
  $("#nextBtn").textContent = last ? (said ? t("finish") : t("skip_finish")) : (said ? t("next_stage") : t("skip_stage"));
  $("#nextBtn").className = "btn" + (said ? " primary" : "");
  $("#ttsBtn").hidden = !tts; $("#ttsBtn").textContent = t(ttsOn ? "tts_on" : "tts_off");
  $("#micBtn").title = t(listening ? "mic_on" : "mic_off");
  $("#demoPlay").textContent = t(playTimer ? "pause" : "play");
  const d = S.scripted ? demoOf(S) : null;
  $("#demoNext").textContent = t(d && exPos >= d.steps.length ? "finish" : "next_msg");
}
function enterStage(i, live){
  S.stage = i; renderTeachText();
  sys(`${t("st"+i)}: ${t("g"+i)}`);
  if(live) novaTurn(true);

function novaPrompt(opening){

  return `You are role-playing NOVA, a curious, friendly first-year university student in Kazakhstan. The learner is practising teaching: they teach you the topic "${tp.title}".

- Keep replies short: 1 to 3 sentences, under 60 words. Sound like a real student. No lists, no markdown.
- If the learner is vague, uses jargon, or skips steps, say honestly that you are confused and ask ONE specific question.

${opening ? "This stage has just started: write your opening message for it." : "Continue the conversation naturally within this stage."}

CONVERSATION SO FAR:
${S.msgs.map(m => `[Stage ${m.stage+1}] ${m.who==="me"?"LEARNER":"NOVA"}: ${m.text}`).join("\n") || "(none yet)"}

async function novaTurn(opening){

  if(!ai){ d.parentNode.remove(); sys(t("no_live")); busy=false; setBusy(); return; }

    const r = await ai(novaPrompt(opening), {cache:false, onText:({text}) => { if(mine===S){ d.textContent = text; scroll(); } }});
    if(mine!==S){ busy=false; setBusy(); return; }
    const text = (r.text||"").trim();
    d.textContent = text;
    S.msgs.push({who:"nova", text, stage:S.stage, at:Date.now()});
    speak(text);
  }catch(e){ d.parentNode.remove(); aiError(e); }

async function coach(i){

  if(!stageMsgs) return;
  const prompt = `You support a university EDUCATOR who reviews your feedback and keeps authority over assessment. Give evidence-linked formative feedback on the LEARNER's own messages in stage "${st.name}" (Bloom level: ${st.bloom}) while they teach the topic "${tp.title}" to an AI novice learner. Look at conceptual accuracy, teaching clarity and how the learner responds to the novice's confusion.

Educator's key ideas (numbered from 0): ${JSON.stringify(tp.keys)}
Misconceptions the AI learner holds: ${JSON.stringify(tp.mis)}

Judge conceptual understanding only. Do NOT penalise language, grammar, spelling, accent, informality or which language (Kazakh/Russian/English) is used. Do not reward length or confident tone.
Levels: 0 ${LEVEL_DESC[0]}; 1 ${LEVEL_DESC[1]}; 2 ${LEVEL_DESC[2]}; 3 ${LEVEL_DESC[3]}; 4 ${LEVEL_DESC[4]}.

Full conversation for context:
${S.msgs.map(m => `[Stage ${m.stage+1}] ${m.who==="me"?"LEARNER":"NOVA"}: ${m.text}`).join("\n")}

${stageMsgs}

  try{
    const v = await askJSON(prompt, "quick");
    const r = {score:Math.max(0, Math.min(4, parseInt(v.score)||0)), errors:(v.errors||[]).map(String), evidence:String(v.evidence||""), tip:String(v.tip||"")};
    (v.covered||[]).forEach(c => { const k = parseInt(c && c.i); if(k>=0 && k<tp.keys.length && mine.covered[k]===undefined) mine.covered[k] = String(c.quote||""); });

let exPos = 0, playTimer = null;
function exStep(){
  if(!S || !S.scripted) return false;
  const d = demoOf(S);
  if(exPos >= d.steps.length){ stopPlay(); finish(); return false; }
  const st = d.steps[exPos++];
  if(st.s !== S.stage) enterStage(st.s, false);
  if(st.skip){ S.results[st.s] = {score:0, errors:[], evidence:"", tip:"", skipped:true}; sys(t("skipped")); }
  else{
    bubble(st.w, st.t);
    S.msgs.push({who:st.w, text:st.t, stage:st.s, at:S.startedAt + exPos*42000});
    if(st.coach){ S.results[st.s] = {score:st.coach.score, errors:st.coach.errors, evidence:st.coach.evidence, tip:st.coach.tip}; Object.keys(st.coach.covered).forEach(k => S.covered[k] = st.coach.covered[k]); }
    if(st.w==="nova") speak(st.t);

}

    const d = demoOf(S), last = d.steps[Math.max(0, exPos-1)]; const wait = Math.min(5200, 1100 + ((last.t||"").length)*16);

}

function setAI(s){
  sample = s; aiKnown = true; aiResolve(s); setStatus();
  if(role==="student" && screen==="home") renderHome();
}
show(); setBusy();
let tries = 0;
(function boot(){
  if(!(window.claude && typeof window.claude.use === "function")){ if(++tries < 30) return setTimeout(boot, 100); return setAI(null); }
  window.claude.use("sample").then(s => setAI(s || null)).catch(() => setAI(null));
  window.claude.use("dictation").then(d => {
    if(!d) return; dict = d; $("#micBtn").hidden = false;
    d.onState(({state}) => { listening = state==="listening"; $("#micBtn").classList.toggle("on", listening); $("#micBtn").title = t(listening ? "mic_on" : "mic_off"); });
    d.onPartial(({text}) => { $("#inp").value = baseText + text; autosize(); });
    d.onFinal(({text}) => { baseText = baseText + text + " "; $("#inp").value = baseText; autosize(); });
  }).catch(()=>{});
  window.claude.use("tts").then(x => { if(!x) return; tts = x; if(screen==="teach") $("#ttsBtn").hidden = false; }).catch(()=>{});
})();
})();
</script>
</body>
</html>
